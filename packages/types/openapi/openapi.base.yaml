openapi: 3.1.0
info:
  title: Nia API — base contract
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >
    Cross-cutting base contract shared by every Nia API surface (Book VIII ch. 4).
    Reusable components only — no feature endpoints, no domain schemas. Feature
    paths are added per an Engineering-Locked Product Specification; behaviour
    never derives directly from Nia OS (ADR-0007, ADR-0009).
servers:
  - url: /v1
    description: Version 1. APIs are versioned in the path (Book VIII §4.6).

tags:
  - name: ops
    description: Operational, non-Member-facing endpoints.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [ops]
      summary: Liveness and readiness probe. Operational; not Member-facing.
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Service is healthy.
          headers:
            X-Nia-Server-Time:
              $ref: "#/components/headers/ServerTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    MemberSession:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Phone-first, device-bound session token (Book VIII §1.3, §4.1). Issued
        after phone verification with device binding; recovery is human-mediated
        and audited.

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: >
        The Member's language (Book VIII §4.1 — every endpoint returns content in
        the Member's language). BCP-47 tag; falls back to English.
      schema:
        type: string
        example: hi
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Required on every mutating request (Book VIII §1.7, §4.1). A retry with
        the same key produces the same outcome — no duplicate wage, remittance,
        or enrolment.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor. Omit for the first page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    ServerTime:
      description: >
        Server timestamp for this response (Book VIII §1.5, §4.1 — server time is
        the only time the backend uses; a client timestamp is a hint, never a fact).
      schema:
        type: string
        format: date-time

  schemas:
    Error:
      type: object
      description: >
        The Nia error envelope (Book VIII §4.7). A response that lacks these
        fields is not a valid Nia error response.
      required: [code, message, correlation_id]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Machine-readable, stable across API versions.
          example: idempotency_key_required
        message:
          type: string
          description: Human-readable, in the requester's language.
        correlation_id:
          type: string
          format: uuid
          description: Correlation id for tracing across services and logs.
        retry:
          type: object
          description: Present only where the operation is retryable (the retry hint).
          additionalProperties: false
          properties:
            retryable:
              type: boolean
            after_seconds:
              type: integer
              minimum: 0
    PageInfo:
      type: object
      description: Cursor-pagination envelope (engineering convention, not product).
      required: [has_more]
      additionalProperties: false
      properties:
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when there is no next page.
        has_more:
          type: boolean
    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

  responses:
    BadRequest:
      description: The request was malformed.
      headers:
        X-Nia-Server-Time:
          $ref: "#/components/headers/ServerTime"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid session.
      headers:
        X-Nia-Server-Time:
          $ref: "#/components/headers/ServerTime"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The actor has no granted permission for this record (default-deny, Book VIII §1.4).
      headers:
        X-Nia-Server-Time:
          $ref: "#/components/headers/ServerTime"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist or is not visible to the actor.
      headers:
        X-Nia-Server-Time:
          $ref: "#/components/headers/ServerTime"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: A version or idempotency conflict.
      headers:
        X-Nia-Server-Time:
          $ref: "#/components/headers/ServerTime"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded. Retry per the hint.
      headers:
        X-Nia-Server-Time:
          $ref: "#/components/headers/ServerTime"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: An unexpected error. Still carries the full error envelope (Book VIII §4.7).
      headers:
        X-Nia-Server-Time:
          $ref: "#/components/headers/ServerTime"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

security:
  - MemberSession: []
