openapi: 3.1.0
info:
  title: Nia API — Ops / scheduler triggers (service-to-service)
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >
    Service-authed triggers for Nia's scheduled background work. Nia runs its jobs
    by having an EXTERNAL scheduler (cron/queue) call these endpoints, so the batch
    operations stay pure and runnable anywhere — there is no in-process timer.
    Every endpoint uses the SERVICE token (`X-Nia-Service-Token`, a Founder/ops
    secret), never a Member session, and every job is IDEMPOTENT (safe to call on
    any cadence). Currently: the remittance SLA sweep (ADR-0013).
servers:
  - url: /v1
    description: Version 1. APIs are versioned in the path (Book VIII §4.6).

tags:
  - name: ops
    description: Service-authed scheduler triggers for background jobs.

paths:
  /ops/remittance-sla-sweep:
    post:
      operationId: runRemittanceSlaSweep
      tags: [ops]
      summary: Escalate every remittance whose 24h SLA has breached (ADR-0013).
      description: >
        Scans all unconfirmed remittances and escalates the ones past their 24h
        SLA to the Operator. Idempotent — an already-escalated remittance is not
        re-raised, so this is safe to run on any schedule.
      security:
        - ServiceToken: []
      responses:
        "200":
          description: The sweep summary.
          headers:
            X-Nia-Server-Time:
              $ref: "./openapi.base.yaml#/components/headers/ServerTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlaSweepResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "./openapi.base.yaml#/components/responses/InternalError"

  /ops/savings-accrual:
    post:
      operationId: runSavingsAccrual
      tags: [ops]
      summary: Accrue interest on every savings account up to now (ADR-0016).
      description: >
        Runs the interest-accrual job across all accounts via the Founder-owned
        interest policy. Idempotent per instant (accrual is a no-op when now is not
        after an account's last accrual).
      security:
        - ServiceToken: []
      responses:
        "200":
          description: The accrual summary.
          headers:
            X-Nia-Server-Time:
              $ref: "./openapi.base.yaml#/components/headers/ServerTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccrualResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "./openapi.base.yaml#/components/responses/InternalError"

  /ops/savings-settle-withdrawals:
    post:
      operationId: runSavingsSettlement
      tags: [ops]
      summary: Settle savings withdrawals past their T+n settlement time (ADR-0016).
      description: >
        Moves every `available` withdrawal whose disclosed settlement time has
        passed to `settled`. The Member already had the cash on withdrawal; this
        clears the rail leg. Idempotent.
      security:
        - ServiceToken: []
      responses:
        "200":
          description: The settlement summary.
          headers:
            X-Nia-Server-Time:
              $ref: "./openapi.base.yaml#/components/headers/ServerTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "./openapi.base.yaml#/components/responses/InternalError"

  /ops/reconciliation:
    get:
      operationId: listReconciliationConflicts
      tags: [ops]
      summary: The Operator's pending money-conflict queue (read-only, ADR-0015).
      description: >
        Every queued offline money conflict, oldest-first — making the ADR-0015
        guarantee ("a money conflict surfaces to the Operator, never lost")
        visible. READ-ONLY: resolving a conflict (which value wins, and its money
        effect) is a Founder decision (OD-8), so there is no mutation route.
      security:
        - ServiceToken: []
      responses:
        "200":
          description: The pending conflicts.
          headers:
            X-Nia-Server-Time:
              $ref: "./openapi.base.yaml#/components/headers/ServerTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "./openapi.base.yaml#/components/responses/InternalError"

  /ops/reconciliation/{recordId}:
    get:
      operationId: listReconciliationConflictsForRecord
      tags: [ops]
      summary: The queued money conflicts for one record (read-only).
      security:
        - ServiceToken: []
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The record's conflicts.
          headers:
            X-Nia-Server-Time:
              $ref: "./openapi.base.yaml#/components/headers/ServerTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "./openapi.base.yaml#/components/responses/InternalError"

  /ops/reconciliation/{id}/resolve:
    post:
      operationId: resolveReconciliationConflict
      tags: [ops]
      summary: Resolve a money conflict (OD-8 / ADR-0019).
      description: >
        The Operator resolves a pending money conflict as `accept_proposal`
        (the client's write becomes authoritative), `keep_server` (the server
        value stands), or `manual` (a corrected authoritative amount, in
        `payload`). Every resolution is an authoritative ledger write recording
        the operator + reason. Gated by the per-operator credential
        (`X-Nia-Operator-Token`), not the service token. 409 if already resolved.
      security:
        - OperatorCredential: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: The resolved conflict.
          headers:
            X-Nia-Server-Time:
              $ref: "./openapi.base.yaml#/components/headers/ServerTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationConflict"
        "400":
          $ref: "./openapi.base.yaml#/components/responses/BadRequest"
        "401":
          description: Missing or invalid operator credential.
          content:
            application/json:
              schema:
                $ref: "./openapi.base.yaml#/components/schemas/Error"
        "404":
          $ref: "./openapi.base.yaml#/components/responses/NotFound"
        "409":
          $ref: "./openapi.base.yaml#/components/responses/Conflict"
        "500":
          $ref: "./openapi.base.yaml#/components/responses/InternalError"

components:
  responses:
    Unauthorized:
      description: Missing or invalid service token.
      content:
        application/json:
          schema:
            $ref: "./openapi.base.yaml#/components/schemas/Error"

  securitySchemes:
    ServiceToken:
      type: apiKey
      in: header
      name: X-Nia-Service-Token
      description: A Founder/ops-owned shared service secret (constant-time verified).
    OperatorCredential:
      type: apiKey
      in: header
      name: X-Nia-Operator-Token
      description: A per-operator credential resolved to an operator identity (OD-8).

  schemas:
    SlaSweepResult:
      type: object
      required: [scanned, escalated]
      additionalProperties: false
      properties:
        scanned:
          type: integer
          minimum: 0
          description: How many unconfirmed remittances were examined.
        escalated:
          type: array
          description: The remittance ids freshly escalated to the Operator this sweep.
          items:
            type: string

    AccrualResult:
      type: object
      required: [scanned, accrued]
      additionalProperties: false
      properties:
        scanned:
          type: integer
          minimum: 0
          description: How many savings accounts were examined.
        accrued:
          type: integer
          minimum: 0
          description: How many accounts had interest accrued this run.

    SettlementResult:
      type: object
      required: [settled]
      additionalProperties: false
      properties:
        settled:
          type: array
          description: The withdrawal ids moved available → settled this run.
          items:
            type: string

    ConflictList:
      type: object
      required: [conflicts]
      additionalProperties: false
      properties:
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationConflict"

    ReconciliationConflict:
      type: object
      description: A queued offline money conflict and, once worked, its audited resolution (OD-8).
      required: [id, record_id, record_class, proposed_updated_at, at, status]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The conflict id (the resolve target).
        record_id:
          type: string
        record_class:
          type: string
          enum: [money]
        proposed_updated_at:
          type: string
          format: date-time
          description: The client proposal's version.
        server_updated_at:
          type: string
          format: date-time
          description: The diverged server version (absent if there was no base).
        at:
          type: string
          format: date-time
          description: When the conflict was queued.
        status:
          type: string
          enum: [pending, resolved]
        resolution:
          $ref: "#/components/schemas/ConflictResolution"

    ConflictResolution:
      type: object
      description: How the Operator resolved the conflict (present once status is resolved).
      required: [choice, operator_id, reason, resolved_at, persisted]
      additionalProperties: false
      properties:
        choice:
          type: string
          enum: [accept_proposal, keep_server, manual]
        operator_id:
          type: string
        reason:
          type: string
        resolved_at:
          type: string
          format: date-time
        persisted:
          type: boolean
          description: Whether the resolution wrote an authoritative record (keep_server does not).

    ResolveRequest:
      type: object
      required: [choice, reason]
      additionalProperties: false
      properties:
        choice:
          type: string
          enum: [accept_proposal, keep_server, manual]
        reason:
          type: string
          minLength: 1
          description: The audit note — why the Operator resolved it this way.
        payload:
          description: The corrected authoritative payload — required for and only used by `manual`.

security:
  - ServiceToken: []
