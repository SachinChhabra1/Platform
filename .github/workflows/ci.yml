name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      # Prove the gates are fail-closed (catch planted violations)...
      - name: Lint gates self-test
        run: node scripts/lint/selftest.mjs
      # ...then prove real source is clean.
      - name: Lint gates
        run: node scripts/lint/run.mjs

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      # Validate the shared OpenAPI contract (packages/types; Book VIII ch. 4).
      - name: Validate API contract
        run: npx --yes @redocly/cli@1.25.0 lint packages/types/openapi/openapi.base.yaml packages/types/openapi/openapi.wallet.yaml packages/types/openapi/openapi.membership.yaml

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Test
        run: pnpm -r --if-present test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
      # i18n first — the Member app depends on it via a path dependency.
      - name: i18n analyze + test
        run: cd packages/i18n && flutter pub get && flutter analyze && flutter test
      - name: member analyze + test
        run: cd apps/member && flutter pub get && flutter analyze && flutter test
